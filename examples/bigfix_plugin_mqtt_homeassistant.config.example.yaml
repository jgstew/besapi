---
# Copy to bigfix_plugin_mqtt_homeassistant.config.yaml (git ignored) and fill in.
mqtt:
  host: homeassistant.local
  port: 1883
  username: <MQTT_USER>
  # plaintext is encrypted in place, once it has worked, when run by the
  # root server plugin service:
  password: <MQTT_PASSWORD>
  # true for a TLS broker (usually port 8883), using the system CA certs:
  tls: false
  # Home Assistant's MQTT discovery prefix, the default is homeassistant:
  discovery_prefix: homeassistant
  base_topic: bigfix

# optional, replaces the default sensors (Computers: reported in 45 days, Actions: open, Users,
